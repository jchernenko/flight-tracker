<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flight Wall</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ff9d00; /* Amber LED */
            --text-bright: #ffcc66;
            --text-dim: #7a5a20;
            --border-color: #332000;
            --muted: #8a7550;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--text-color);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #0a0a0a;
            color: var(--muted);
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 8px 18px;
            border-radius: 3px;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--text-bright);
            border-color: var(--text-color);
            text-shadow: 0 0 6px var(--text-color);
        }

        .board, .radar-wrap {
            width: 100%;
            max-width: 900px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            background-color: #0a0a0a;
        }

        .view { display: none; width: 100%; max-width: 900px; }
        .view.active { display: block; }

        .row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .row:last-child { border-bottom: none; }

        .row-main {
            display: grid;
            grid-template-columns: 2fr 2fr 2fr 1fr;
            gap: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .row-sub {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.03em;
        }

        .header-row {
            color: var(--text-bright);
            border-bottom: 2px solid var(--text-color);
            margin-bottom: 10px;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: var(--muted);
        }

        .flash { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .status-bar {
            margin-top: 20px;
            font-size: 1rem;
            color: #666;
        }

        canvas#radar {
            display: block;
            width: 100%;
            height: auto;
            background: #0a0a0a;
        }

        @media (prefers-reduced-motion: reduce) {
            .flash { animation: none; }
        }
    </style>
</head>
<body>

    <h1>LOCAL RADAR: <span class="flash">ACTIVE</span></h1>

    <div class="tabs">
        <button class="tab-btn active" data-view="board">Board</button>
        <button class="tab-btn" data-view="radar">Radar</button>
    </div>

    <div class="view active" id="view-board">
        <div class="board">
            <div class="row-main header-row">
                <div>Callsign</div>
                <div>Alt (ft)</div>
                <div>Spd (kt)</div>
                <div>Hdg</div>
            </div>
            <div id="flight-data">
                <div class="empty-state">SCANNING AIRSPACE...</div>
            </div>
        </div>
    </div>

    <div class="view" id="view-radar">
        <div class="radar-wrap">
            <canvas id="radar" width="800" height="800"></canvas>
        </div>
    </div>

    <div class="status-bar" id="last-updated">Waiting for connection...</div>

    <script>
        const state = {
            config: { center_lat: 49.22, center_lon: -122.60, radius_nm: 27 },
            flights: [],
            view: "board",
        };

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                state.config = await response.json();
            } catch (e) {
                console.error("Error fetching config, using defaults:", e);
            }
        }

        function switchView(view) {
            state.view = view;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
            document.getElementById('view-board').classList.toggle('active', view === 'board');
            document.getElementById('view-radar').classList.toggle('active', view === 'radar');
            startRadarLoopIfNeeded();
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchView(btn.dataset.view));
        });

        function subLine(flight) {
            const parts = [];
            if (flight.airline) {
                parts.push(flight.flight_number ? `${flight.airline} · Flight ${flight.flight_number}` : flight.airline);
            } else if (flight.registration) {
                parts.push(flight.registration);
            }
            if (flight.route) parts.push(`${flight.route.origin} &rarr; ${flight.route.destination}`);
            if (flight.type_name) parts.push(flight.type_name);
            if (flight.military) parts.push('MIL');
            return parts.join(' &middot; ');
        }

        function renderBoard() {
            const container = document.getElementById('flight-data');
            if (state.flights.length === 0) {
                container.innerHTML = '<div class="empty-state">NO AIRCRAFT IN RANGE</div>';
                return;
            }
            const sorted = [...state.flights].sort((a, b) => b.altitude - a.altitude);
            container.innerHTML = sorted.map(flight => {
                const alt = flight.altitude.toString().padStart(5, '0');
                const spd = flight.speed.toString().padStart(3, '0');
                const hdg = flight.heading.toString().padStart(3, '0');
                const sub = subLine(flight);
                return `
                    <div class="row">
                        <div class="row-main">
                            <div>${flight.callsign}</div>
                            <div>${alt}</div>
                            <div>${spd}</div>
                            <div>${hdg}&deg;</div>
                        </div>
                        ${sub ? `<div class="row-sub">${sub}</div>` : ''}
                    </div>`;
            }).join('');
        }

        // --- Radar view ---
        const canvas = document.getElementById('radar');
        const ctx = canvas.getContext('2d');
        const radarTracks = new Map(); // callsign -> {lat, lon, heading, speed, timestamp, flight}
        let sweepAngle = 0;
        let lastFrameTime = performance.now();

        function updateRadarTracks() {
            const now = Date.now();
            const seen = new Set();
            for (const flight of state.flights) {
                if (flight.lat == null || flight.lon == null) continue;
                seen.add(flight.callsign);
                radarTracks.set(flight.callsign, {
                    lat: flight.lat,
                    lon: flight.lon,
                    heading: flight.heading,
                    speed: flight.speed,
                    timestamp: now,
                    flight,
                });
            }
            for (const callsign of [...radarTracks.keys()]) {
                if (!seen.has(callsign)) radarTracks.delete(callsign);
            }
        }

        function projectForward(track, elapsedSeconds) {
            const distKm = (track.speed * 1.852 / 3600) * elapsedSeconds;
            const headingRad = track.heading * Math.PI / 180;
            const dxKm = distKm * Math.sin(headingRad);
            const dyKm = distKm * Math.cos(headingRad);
            const lat = track.lat + dyKm / 111.32;
            const lon = track.lon + dxKm / (111.32 * Math.cos(track.lat * Math.PI / 180));
            return { lat, lon };
        }

        function latLonToPx(lat, lon, cx, cy, pxPerKm) {
            const { center_lat, center_lon } = state.config;
            const kmPerDegLon = 111.32 * Math.cos(center_lat * Math.PI / 180);
            const dxKm = (lon - center_lon) * kmPerDegLon;
            const dyKm = (lat - center_lat) * 111.32;
            return { x: cx + dxKm * pxPerKm, y: cy - dyKm * pxPerKm };
        }

        function drawRadar() {
            const now = performance.now();
            const dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            sweepAngle = (sweepAngle + dt * 0.7) % (Math.PI * 2);

            const w = canvas.width, h = canvas.height;
            const cx = w / 2, cy = h / 2;
            const maxPxRadius = Math.min(w, h) / 2 - 40;
            const rangeKm = state.config.radius_nm * 1.852;
            const pxPerKm = maxPxRadius / rangeKm;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            // sweep
            const sweepGrad = ctx.createConicGradient(sweepAngle - Math.PI / 2 - 0.5, cx, cy);
            sweepGrad.addColorStop(0, 'rgba(255,157,0,0)');
            sweepGrad.addColorStop(0.92, 'rgba(255,157,0,0)');
            sweepGrad.addColorStop(1, 'rgba(255,157,0,0.18)');
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, maxPxRadius, 0, Math.PI * 2);
            ctx.clip();
            ctx.fillStyle = sweepGrad;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();

            // range rings
            ctx.strokeStyle = '#332000';
            ctx.fillStyle = '#7a5a20';
            ctx.font = '12px "Courier New", monospace';
            [1 / 3, 2 / 3, 1].forEach(frac => {
                ctx.beginPath();
                ctx.arc(cx, cy, maxPxRadius * frac, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillText(`${Math.round(state.config.radius_nm * frac)}NM`, cx + 4, cy - maxPxRadius * frac + 12);
            });

            // compass
            ctx.fillStyle = '#ff9d00';
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('N', cx, cy - maxPxRadius - 12);
            ctx.fillText('S', cx, cy + maxPxRadius + 20);
            ctx.textAlign = 'left';
            ctx.fillText('E', cx + maxPxRadius + 8, cy + 5);
            ctx.textAlign = 'right';
            ctx.fillText('W', cx - maxPxRadius - 8, cy + 5);
            ctx.textAlign = 'left';

            // station marker
            ctx.strokeStyle = '#ff9d00';
            ctx.beginPath();
            ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
            ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
            ctx.stroke();

            // aircraft
            const nowMs = Date.now();
            for (const track of radarTracks.values()) {
                const elapsed = (nowMs - track.timestamp) / 1000;
                const pos = projectForward(track, elapsed);
                const { x, y } = latLonToPx(pos.lat, pos.lon, cx, cy, pxPerKm);
                if (Math.hypot(x - cx, y - cy) > maxPxRadius + 20) continue;

                const f = track.flight;
                const brightness = Math.min(1, 0.45 + f.altitude / 40000);
                const color = `rgba(255, ${Math.round(157 + 60 * brightness)}, ${Math.round(60 * brightness)}, ${brightness})`;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((track.heading || 0) * Math.PI / 180);
                ctx.fillStyle = f.military ? '#ff5050' : color;
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(5, 6);
                ctx.lineTo(0, 3);
                ctx.lineTo(-5, 6);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = '#ffcc66';
                ctx.font = '11px "Courier New", monospace';
                ctx.fillText(f.callsign, x + 9, y - 4);
                ctx.fillStyle = '#8a7550';
                const fl = Math.round(f.altitude / 100).toString().padStart(3, '0');
                const spdTag = Math.round(f.speed / 10).toString().padStart(2, '0');
                ctx.fillText(`${fl} ${spdTag}`, x + 9, y + 8);
                if (f.route) {
                    ctx.fillText(`${f.route.origin}→${f.route.destination}`, x + 9, y + 20);
                }
            }

            requestAnimationFrame(() => { if (state.view === 'radar') drawRadar(); });
        }

        function startRadarLoopIfNeeded() {
            if (state.view === 'radar') {
                lastFrameTime = performance.now();
                requestAnimationFrame(drawRadar);
            }
        }

        async function fetchFlights() {
            try {
                const response = await fetch('/api/flights');
                const data = await response.json();
                state.flights = data.flights;
                updateRadarTracks();
                renderBoard();

                const timeContainer = document.getElementById('last-updated');
                if (data.timestamp) {
                    timeContainer.innerText = `LAST UPDATE: ${new Date(data.timestamp * 1000).toLocaleTimeString()} · ${data.flights.length} aircraft`;
                } else {
                    timeContainer.innerText = 'WAITING FOR FIRST UPDATE...';
                }
            } catch (error) {
                console.error("Error fetching flights:", error);
                document.getElementById('flight-data').innerHTML = '<div class="empty-state">CONNECTION ERROR</div>';
            }
        }

        (async function init() {
            await loadConfig();
            fetchFlights();
            setInterval(fetchFlights, 10000);
            startRadarLoopIfNeeded();
        })();
    </script>
</body>
</html>
